name: Restore exact source-rescue PNG

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/restore_exact_source_rescue_png.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Restore and verify PNG pixels
        run: |
          python -m pip install --quiet pillow
          git show 9e814fc77d67bc4674ab91b7da3a50e71a0a0518:assets/figures/source_rescue.png > /tmp/source_rescue.png
          python - <<'PY'
          from PIL import Image
          import hashlib
          from pathlib import Path

          p = Path('/tmp/source_rescue.png')
          im = Image.open(p)
          assert im.size == (1662, 1509), im.size
          pixel_hash = hashlib.sha256(im.convert('RGB').tobytes()).hexdigest()
          expected = 'c75dfb32fb74e781a2a44dadf3f4f11e56ac850d7d94952f9482d51275669c59'
          print('pixel_sha256=', pixel_hash)
          assert pixel_hash == expected, (pixel_hash, expected)
          assert p.read_bytes()[:8] == b'\x89PNG\r\n\x1a\n'
          PY

          cp /tmp/source_rescue.png assets/figures/source_rescue.png
          sed -i 's#assets/figures/source_rescue\.webp#assets/figures/source_rescue.png#g' README.md
          sed -i 's#\.\./assets/figures/source_rescue\.webp#../assets/figures/source_rescue.png#g' paper/main.md
          rm -f assets/figures/source_rescue.webp
          rm -f .github/workflows/restore_exact_source_rescue_png.yml

      - name: Commit verified PNG
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore verified source-rescue PNG and remove WebP'
          git push origin HEAD:main
