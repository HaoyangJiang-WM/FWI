[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowmap-multiback"
version = "0.1.0"
description = "Inference-time source-orbit and Multi-Back control for frozen generative flows"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7", "torch>=2.1"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
