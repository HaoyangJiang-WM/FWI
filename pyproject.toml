[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowmap-multiback"
version = "0.1.0"
description = "Inference-time source-orbit and Multi-Back control for frozen generative flows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7", "torch>=2.1"]
keywords = ["inverse problems", "flow matching", "full-waveform inversion"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/HaoyangJiang-WM/FWI"
Issues = "https://github.com/HaoyangJiang-WM/FWI/issues"
Documentation = "https://github.com/HaoyangJiang-WM/FWI/tree/main/docs"
Paper = "https://github.com/HaoyangJiang-WM/FWI/blob/main/paper/main.md"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
